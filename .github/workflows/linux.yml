name: Unified monitors and Linux deployment
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: node scripts/sync-linux-dependencies.mjs --check
      - run: npm test
      # build:linux runs the explicit TypeScript check before both Vite builds.
      - run: npm run build:linux
      - run: node tests/linux-smoke.mjs
      - run: systemd-analyze verify deploy/market-spread-monitor.service
  one-click-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: bash -n deploy/install.sh && bash -n deploy/profile-install.sh
      - run: shellcheck deploy/install.sh deploy/profile-install.sh server/entrypoint.sh
      - run: node tests/install-smoke.mjs
